                  setContentView(buildUi())
                  for ((role, text) in Bus.transcript) addBubble(role == "user", text)
                  if (Bus.transcript.isEmpty()) addBubble(false, "Sistemler çevrimiçi. Beni \"${Prefs.wakeWord}\" diyerek çağır ya da yaz.")
                  applyState(Bus.state)
              }

              override fun onResume() {
                  super.onResume()
                  Bus.add(this)
                  refreshBanner()
                  if (Perms.micGranted(this) && Prefs.wakeOn && !NovaxService.running) NovaxService.start(this)
              }

              override fun onPause() { super.onPause(); Bus.remove(this) }

              // ------------------------------------------------------------------ UI
              private fun buildUi(): View {
                  val root = FrameLayout(this)
                  root.addView(HudBackgroundView(this), FrameLayout.LayoutParams(-1, -1))

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.fitsSystemWindows = true
                  col.setPadding(Ui.dp(this, 14f), Ui.dp(this, 6f), Ui.dp(this, 14f), Ui.dp(this, 8f))
                  root.addView(col, FrameLayout.LayoutParams(-1, -1))

                  // üst çubuk
                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL
                  val titles = LinearLayout(this)
                  titles.orientation = LinearLayout.VERTICAL
                  val title = Ui.text(this, "N O V A X", 22f, Ui.CYAN, true)
                  titles.addView(title)
                  titles.addView(Ui.text(this, "NEURAL ASSISTANT // v1.0", 10f, Ui.CYAN_DIM))
                  top.addView(titles, Ui.lp(0, -2, 1f))
                  dot = View(this)
                  dot.background = Ui.box(this, Ui.CYAN, Ui.CYAN, 20f, 0f)
                  top.addView(dot, Ui.margins(Ui.lp(Ui.dp(this, 9f), Ui.dp(this, 9f)), this, 0f, 0f, 8f, 0f))
                  val gear = Ui.button(this, "⚙", Ui.CYAN) { startActivity(Intent(this, SetupActivity::class.java)) }
                  top.addView(gear)
                  col.addView(top, Ui.lp())

                  // uyarı bandı
                  banner = Ui.panel(this)
                  banner.background = Ui.box(this, Color.parseColor("#2A1A00"), Ui.AMBER, 8f)
                  col.addView(banner, Ui.margins(Ui.lp(), this, 0f, 8f, 0f, 0f))

                  // reaktör
                  val rf = FrameLayout(this)
                  reactor = JarvisReactorView(this)
                  rf.addView(reactor, FrameLayout.LayoutParams(-1, -1))
                  reactor.setOnClickListener { onMic() }
                  statusLabel = Ui.text(this, "STANDBY", 12f, Ui.CYAN, true)
                  statusLabel.letterSpacing = 0.3f
                  val sl = FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
                  rf.addView(statusLabel, sl)
                  col.addView(rf, Ui.lp(-1, 0, 1.05f))

                  wave = WaveView(this)
                  col.addView(wave, Ui.lp(-1, Ui.dp(this, 34f)))

                  partialLabel = Ui.text(this, "", 13f, Ui.CYAN_DIM)
                  partialLabel.gravity = Gravity.CENTER
                  partialLabel.minHeight = Ui.dp(this, 20f)
                  col.addView(partialLabel, Ui.lp())

                  // sohbet akışı
                  scroll = ScrollView(this)
                  scroll.isVerticalScrollBarEnabled = false
                  feed = LinearLayout(this)
                  feed.orientation = LinearLayout.VERTICAL
                  scroll.addView(feed, FrameLayout.LayoutParams(-1, -2))
                  col.addView(scroll, Ui.lp(-1, 0, 1f))

                  // hızlı komutlar
                  val chips = LinearLayout(this)
                  val chipScroll = HorizontalScrollView(this)
                  chipScroll.isHorizontalScrollBarEnabled = false
                  for ((label, cmd) in listOf(
                      "🕒 Saat" to "saat kaç", "🔋 Pil" to "pil durumu", "👁 Ekranı oku" to "ekranda ne var",
                      "🔦 Fener" to "feneri aç", "🌤 Hava" to "hava durumu", "📰 Haber" to "son dakika haberler",
                      "📝 Notlarım" to "notlarım", "🧠 Hafıza" to "ne hatırlıyorsun", "⚙ Neler yaparsın" to "neler yapabilirsin"
                  )) {
                      val c = Ui.button(this, label, Ui.CYAN_DIM) { Brain.handle(cmd) }
                      chips.addView(c, Ui.margins(Ui.lp(-2, -2), this, 0f, 0f, 6f, 0f))
                  }
                  chipScroll.addView(chips)
                  col.addView(chipScroll, Ui.margins(Ui.lp(), this, 0f, 6f, 0f, 6f))

                  // giriş satırı
                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  input = Ui.edit(this, "Komut yaz…")
                  input.imeOptions = EditorInfo.IME_ACTION_SEND
                  input.setOnEditorActionListener { _, id, ev ->
                      if (id == EditorInfo.IME_ACTION_SEND || (ev?.keyCode == KeyEvent.KEYCODE_ENTER && ev.action == KeyEvent.ACTION_DOWN)) { send(); true } else false
                  }
                  row.addView(input, Ui.lp(0, -2, 1f))
                  val sendBtn = Ui.button(this, "➤", Ui.CYAN) { send() }
                  row.addView(sendBtn, Ui.margins(Ui.lp(-2, -2), this, 6f, 0f, 0f, 0f))
                  micBtn = Ui.text(this, "🎙", 22f, Ui.CYAN)
                  micBtn.gravity = Gravity.CENTER
                  micBtn.background = Ui.box(this, Color.parseColor("#0B2233"), Ui.CYAN, 30f, 1.5f)
                  micBtn.setOnClickListener { onMic() }
                  row.addView(micBtn, Ui.margins(Ui.lp(Ui.dp(this, 52f), Ui.dp(this, 52f)), this, 8f, 0f, 0f, 0f))
                  col.addView(row, Ui.lp())
                  return root
              }

              private fun refreshBanner() {
                  banner.removeAllViews()
                  val miss = Perms.missingCritical(this)
                  if (miss.isEmpty() && Prefs.geminiKey.isNotBlank()) { banner.visibility = View.GONE; return }
                  banner.visibility = View.VISIBLE
                  val lines = ArrayList<String>()
                  if (Prefs.geminiKey.isBlank()) lines.add("• Gemini API anahtarı yok")
                  for (m in miss) lines.add("• ${m.title} izni gerekli")
                  banner.addView(Ui.text(this, "KURULUM EKSİK\n" + lines.joinToString("\n"), 12f, Ui.AMBER))
                  banner.addView(Ui.button(this, "Kuruluma git", Ui.AMBER) { startActivity(Intent(this, SetupActivity::class.java)) },
                      Ui.margins(Ui.lp(-2, -2), this, 0f, 6f, 0f, 0f))
              }

              private fun send() {
                  val t = input.text.toString().trim()
                  if (t.isEmpty()) return
                  input.setText("")
                  (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).hideSoftInputFromWindow(input.windowToken, 0)
                  Voice.stopSpeaking()
                  Brain.handle(t)
              }

              private fun onMic() {
                  if (!Perms.micGranted(this)) { requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO), Perms.REQ); return }
                  if (Voice.speaking) { Voice.stopSpeaking(); return }
                  if (Voice.mode == Voice.Mode.COMMAND) { Voice.stopAll(); if (Prefs.wakeOn) Voice.startWake(); return }
                  Voice.listenOnce()
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  refreshBanner()
                  if (Perms.micGranted(this) && !NovaxService.running) NovaxService.start(this)
              }

              private fun addBubble(user: Boolean, text: String) {
                  val tv = Ui.text(this, (if (user) "› " else "◈ ") + text, 14f, if (user) Color.WHITE else Ui.CYAN)
                  tv.setTextIsSelectable(true)
                  val fill = if (user) Color.parseColor("#12384D") else Color.parseColor("#0A1B2A")
                  tv.background = Ui.box(this, fill, if (user) Ui.CYAN_DIM else Color.parseColor("#33005F73"), 10f)
                  tv.setPadding(Ui.dp(this, 12f), Ui.dp(this, 8f), Ui.dp(this, 12f), Ui.dp(this, 8f))
                  val lp = Ui.margins(Ui.lp(-2, -2), this, if (user) 40f else 0f, 3f, if (user) 0f else 40f, 3f)
                  lp.gravity = if (user) Gravity.END else Gravity.START
                  feed.addView(tv, lp)
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun applyState(s: OrbState) {
                  reactor.state = s
                  wave.state = s
                  val (label, color) = when (s) {
                      OrbState.IDLE -> (if (NovaxService.running && Prefs.wakeOn) "DİNLİYOR · \"${Prefs.wakeWord.uppercase()}\"" else "STANDBY") to Ui.CYAN_DIM
                      OrbState.LISTENING -> "LISTENING" to Ui.CYAN
                      OrbState.THINKING -> "PROCESSING" to Ui.AMBER
                      OrbState.SPEAKING -> "SPEAKING" to Ui.CYAN
                      OrbState.ERROR -> "ERROR" to Ui.RED
                  }
                  statusLabel.text = label
                  statusLabel.setTextColor(color)
                  dot.background = Ui.box(this, color, color, 20f, 0f)
              }

              // ------------------------------------------------------------------ Bus
              override fun onUser(text: String) { addBubble(true, text); partialLabel.text = "" }
              override fun onNovax(text: String) { addBubble(false, text) }
              override fun onState(s: OrbState) { applyState(s) }
              override fun onLevel(v: Float) { reactor.level = v; wave.level = v }
              override fun onPartial(text: String) { partialLabel.text = text }
              override fun onLog(line: String) { partialLabel.text = Text.clip(line, 60) }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/MemoryStore.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/MemoryStore.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import java.text.SimpleDateFormat
          import java.util.*

          /** Kalıcı hafıza: bilgiler (anahtar/değer), konuşma geçmişi ve notlar. */
          object MemoryStore {
              private lateinit var db: SQLiteDatabase

              private class Helper(c: Context) : SQLiteOpenHelper(c, "novax.db", null, 1) {
                  override fun onCreate(d: SQLiteDatabase) {
                      d.execSQL("CREATE TABLE facts(k TEXT PRIMARY KEY, v TEXT NOT NULL, ts INTEGER NOT NULL)")
                      d.execSQL("CREATE TABLE turns(id INTEGER PRIMARY KEY AUTOINCREMENT, role TEXT NOT NULL, txt TEXT NOT NULL, ts INTEGER NOT NULL)")
                      d.execSQL("CREATE TABLE notes(id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL, body TEXT NOT NULL, ts INTEGER NOT NULL)")
                  }
                  override fun onUpgrade(d: SQLiteDatabase, o: Int, n: Int) {}
              }

              fun init(ctx: Context) { db = Helper(ctx.applicationContext).writableDatabase }

              // ---- bilgiler ----
              @Synchronized fun remember(key: String, value: String) {
                  val cv = ContentValues()
                  cv.put("k", key.trim().lowercase()); cv.put("v", value.trim()); cv.put("ts", System.currentTimeMillis())
                  db.insertWithOnConflict("facts", null, cv, SQLiteDatabase.CONFLICT_REPLACE)
              }

              @Synchronized fun forget(key: String): Int =
                  db.delete("facts", "k = ? OR k LIKE ?", arrayOf(key.trim().lowercase(), "%${key.trim().lowercase()}%"))

              @Synchronized fun recall(query: String): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()
                  val q = "%${query.trim().lowercase()}%"
                  val c = if (query.isBlank()) db.rawQuery("SELECT k, v FROM facts ORDER BY ts DESC LIMIT 200", null)
                  else db.rawQuery("SELECT k, v FROM facts WHERE k LIKE ? OR lower(v) LIKE ? ORDER BY ts DESC LIMIT 50", arrayOf(q, q))
                  c.use { while (it.moveToNext()) out.add(it.getString(0) to it.getString(1)) }
                  return out
              }

              fun factsBlock(max: Int = 60): String =
                  recall("").take(max).joinToString("\n") { "- ${it.first}: ${it.second}" }

              // ---- konuşma geçmişi ----
              @Synchronized fun addTurn(role: String, text: String) {
                  val cv = ContentValues()
                  cv.put("role", role); cv.put("txt", text.take(2000)); cv.put("ts", System.currentTimeMillis())
                  db.insert("turns", null, cv)
                  db.execSQL("DELETE FROM turns WHERE id <= (SELECT MAX(id) FROM turns) - 400")
              }

              @Synchronized fun recentTurns(n: Int): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()
                  db.rawQuery("SELECT role, txt FROM turns ORDER BY id DESC LIMIT $n", null).use {
                      while (it.moveToNext()) out.add(it.getString(0) to it.getString(1))
                  }
                  out.reverse()
                  return out
              }

              @Synchronized fun clearTurns() { db.execSQL("DELETE FROM turns") }

              // ---- notlar ----
              @Synchronized fun addNote(title: String, body: String): Long {
                  val cv = ContentValues()
                  cv.put("title", title.ifBlank { "Not" }); cv.put("body", body); cv.put("ts", System.currentTimeMillis())
                  return db.insert("notes", null, cv)
              }

              @Synchronized fun notes(limit: Int = 20): List<String> {
                  val out = ArrayList<String>()
                  val f = SimpleDateFormat("d MMM HH:mm", Locale("tr"))
                  db.rawQuery("SELECT title, body, ts FROM notes ORDER BY id DESC LIMIT $limit", null).use {
                      while (it.moveToNext()) out.add("${f.format(Date(it.getLong(2)))} · ${it.getString(0)}: ${it.getString(1)}")
                  }
                  return out
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Messaging.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Messaging.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.SystemClock
          import android.telephony.SmsManager

          /** Arama, SMS ve WhatsApp (wa.me + erişilebilirlik ile otomatik gönder). */
          object Messaging {
              private val ctx get() = NovaxApp.instance
              private fun has(p: String) = ctx.checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              fun resolve(to: String): Contacts.C? = Contacts.find(to)

              fun findContactText(name: String): String {
                  if (!Contacts.granted()) return "HATA: Rehber izni yok."
                  val c = Contacts.find(name)
                  val more = Contacts.search(name)
                  return when {
                      c != null -> "${c.name.ifBlank { "Numara" }}: ${c.number}" + if (more.size > 1) " (benzerleri: " + more.drop(1).joinToString { it.name } + ")" else ""
                      else -> "Rehberde '$name' bulunamadı."
                  }
              }

              /** "anneme eve geliyorum" -> (Annem, "eve geliyorum"). İlk 1-3 kelimeyi isim olarak dener. */
              fun splitNameText(rest: String): Pair<Contacts.C, String>? {
                  val tokens = rest.trim().split(Regex("\\s+")).filter { it.isNotEmpty() }
                  if (tokens.size < 2) return null
                  for (k in minOf(3, tokens.size - 1) downTo 1) {
                      val name = tokens.take(k).joinToString(" ")
                      val c = Contacts.find(name) ?: continue
                      return c to tokens.drop(k).joinToString(" ")
                  }
                  return null
              }

              // ------------------------------------------------------------------ arama
              fun call(to: String): String {
                  val c = resolve(to) ?: return "HATA: '$to' rehberde yok."
                  val uri = Uri.parse("tel:" + Uri.encode(c.number))
                  return if (has(Manifest.permission.CALL_PHONE)) {
                      if (Act.start(Intent(Intent.ACTION_CALL, uri))) "${c.name.ifBlank { c.number }} aranıyor." else "HATA: arama başlatılamadı"
                  } else {
                      Act.start(Intent(Intent.ACTION_DIAL, uri))
                      "Arama izni yok; numarayı çevirici ekranında açtım."
                  }
              }

              // ------------------------------------------------------------------ SMS
              fun sms(to: String, text: String): String {
                  val c = resolve(to) ?: return "HATA: '$to' rehberde yok."
                  if (text.isBlank()) return "HATA: mesaj boş"
                  if (!has(Manifest.permission.SEND_SMS)) {
                      val i = Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:" + Uri.encode(c.number))).putExtra("sms_body", text)
                      Act.start(i)
                      return "SMS izni yok; mesajı yazıp ekranı açtım, gönder tuşuna basman gerek."
                  }
                  return try {
                      val sm = if (android.os.Build.VERSION.SDK_INT >= 31) ctx.getSystemService(SmsManager::class.java) else @Suppress("DEPRECATION") SmsManager.getDefault()
                      val parts = sm.divideMessage(text)
                      sm.sendMultipartTextMessage(c.number, null, parts, null, null)
                      "SMS gönderildi: ${c.name.ifBlank { c.number }}"
                  } catch (e: Exception) { "HATA: SMS gönderilemedi: ${e.message}" }
              }

              // ------------------------------------------------------------------ WhatsApp
              private fun waPackage(): String? {
                  val pm = ctx.packageManager
                  for (p in listOf("com.whatsapp", "com.whatsapp.w4b")) {
                      try { pm.getPackageInfo(p, 0); return p } catch (_: Exception) {}
                  }
                  return null
              }

              private val sendLabels = listOf("gonder", "send", "enviar", "envoyer", "senden", "invia", "otpravit")

              fun whatsapp(to: String, text: String): String {
                  if (text.isBlank()) return "HATA: mesaj boş"
                  val c = resolve(to) ?: return "HATA: '$to' rehberde bulunamadı."
                  val pkg = waPackage() ?: return "HATA: WhatsApp yüklü değil."
                  val num = Contacts.intl(c.number)
                  val uri = Uri.parse("https://wa.me/$num?text=" + Uri.encode(text))
                  val intent = Intent(Intent.ACTION_VIEW, uri).setPackage(pkg)
                  if (!Act.start(intent)) return "HATA: WhatsApp açılamadı."
                  val who = c.name.ifBlank { c.number }
                  val acc = NovaxAccessibilityService.instance
                      ?: return "WhatsApp'ta $who sohbetini yazılı mesajla açtım; erişilebilirlik kapalı, gönder tuşuna elle bas."
                  return if (clickSend(acc, pkg, 12000)) "WhatsApp mesajı $who kişisine gönderildi."
                  else "Sohbeti açtım ama gönder tuşunu bulamadım; ekranı kontrol et. (Çoğunlukla WhatsApp henüz yüklenmedi veya kilit ekranı açık.)"
              }

              private fun clickSend(acc: NovaxAccessibilityService, pkg: String, timeoutMs: Long): Boolean {
                  Thread.sleep(1800)
                  val end = SystemClock.uptimeMillis() + timeoutMs
                  while (SystemClock.uptimeMillis() < end) {
                      val byId = acc.findByViewId("$pkg:id/send")
                      if (byId.isNotEmpty() && acc.clickNode(byId.first())) { Thread.sleep(600); return true }
                      for (l in sendLabels) {
                          val n = acc.findAll(l, true).firstOrNull()
                          if (n != null && acc.clickNode(n)) { Thread.sleep(600); return true }
                      }
                      Thread.sleep(450)
                  }
                  return false
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/NovaxAccessibilityService.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/NovaxAccessibilityService.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /**
           * Ekran kontrolünün kalbi: ekranı okur, dokunur, kaydırır, yazar, ekran görüntüsü alır.
           * Tüm bloklayan çağrılar (bekleme, hareket) ana thread DIŞINDAN yapılmalıdır.
           */
          class NovaxAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile var instance: NovaxAccessibilityService? = null
                  @Volatile var lastPackage: String = ""
                  val connected: Boolean get() = instance != null
              }

              override fun onServiceConnected() {
                  instance = this
                  Bus.log("Erişilebilirlik servisi bağlandı")
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null) return
                  val p = e.packageName?.toString() ?: return
                  if (e.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED && p != packageName) lastPackage = p
              }

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              // ------------------------------------------------------------------ ağaç gezme
              fun roots(): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  rootInActiveWindow?.let { out.add(it) }
                  try {
                      for (w in windows) { val r = w.root; if (r != null && out.none { it == r }) out.add(r) }
                  } catch (_: Exception) {}
                  return out
              }

              private fun walk(n: AccessibilityNodeInfo?, depth: Int, f: (AccessibilityNodeInfo, Int) -> Boolean) {
                  if (n == null || depth > 45) return
                  if (!f(n, depth)) return
                  for (i in 0 until n.childCount) walk(n.getChild(i), depth + 1, f)
              }

              private fun label(n: AccessibilityNodeInfo): String = Text.norm(n.text?.toString() ?: "")
              private fun desc(n: AccessibilityNodeInfo): String = Text.norm(n.contentDescription?.toString() ?: "")
              private fun hint(n: AccessibilityNodeInfo): String =
                  if (Build.VERSION.SDK_INT >= 26) Text.norm(n.hintText?.toString() ?: "") else ""

              /** Metin / içerik açıklaması / ipucu ile düğüm bulur; tam eşleşmeler ve kısa metinler önce gelir. */
              fun findAll(query: String, exact: Boolean = false): List<AccessibilityNodeInfo> {
                  val q = Text.norm(query)
                  if (q.isEmpty()) return emptyList()
                  val hits = ArrayList<Pair<Int, AccessibilityNodeInfo>>()
                  for (r in roots()) walk(r, 0) { n, _ ->
                      if (n.isVisibleToUser) {
                          val t = label(n); val d = desc(n); val h = hint(n)
                          val eq = t == q || d == q || h == q
                          val has = t.contains(q) || d.contains(q) || h.contains(q)
                          if (eq || (!exact && has)) {
                              val len = maxOf(t.length, d.length, h.length)
                              hits.add((if (eq) 0 else 1000 + len) to n)
                          }
                      }
                      true
                  }
                  return hits.sortedBy { it.first }.map { it.second }
              }

              fun findByViewId(id: String): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  for (r in roots()) out.addAll(r.findAccessibilityNodeInfosByViewId(id))
                  return out
              }

              // ------------------------------------------------------------------ eylemler
              fun clickNode(n: AccessibilityNodeInfo): Boolean {
                  var cur: AccessibilityNodeInfo? = n
                  var hops = 0
                  while (cur != null && hops < 7) {
                      if (cur.isClickable && cur.isEnabled && cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                      cur = cur.parent
                      hops++
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return if (!r.isEmpty) tap(r.exactCenterX(), r.exactCenterY()) else false
              }

              fun clickText(q: String, exact: Boolean = false): Boolean {
                  val n = findAll(q, exact).firstOrNull() ?: return false
                  return clickNode(n)
              }

              fun tap(x: Float, y: Float, hold: Long = 70): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  return gesture(p, hold)
              }

              fun swipe(x1: Float, y1: Float, x2: Float, y2: Float, dur: Long = 350): Boolean {
                  val p = Path()
                  p.moveTo(x1, y1)
                  p.lineTo(x2, y2)
                  return gesture(p, dur)
              }

              fun scroll(direction: String): Boolean {
                  val dm = resources.displayMetrics
                  val w = dm.widthPixels.toFloat()
                  val h = dm.heightPixels.toFloat()
                  return when (direction.lowercase()) {
                      "down", "asagi" -> swipe(w / 2, h * 0.72f, w / 2, h * 0.28f)
                      "up", "yukari" -> swipe(w / 2, h * 0.28f, w / 2, h * 0.72f)
                      "left", "sola" -> swipe(w * 0.85f, h / 2, w * 0.15f, h / 2)
                      "right", "saga" -> swipe(w * 0.15f, h / 2, w * 0.85f, h / 2)
                      else -> false
                  }
              }

              private fun gesture(p: Path, dur: Long): Boolean {
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, dur)).build()
                  val latch = CountDownLatch(1)
                  var ok = false
                  val cb = object : GestureResultCallback() {
                      override fun onCompleted(d: GestureDescription?) { ok = true; latch.countDown() }
                      override fun onCancelled(d: GestureDescription?) { latch.countDown() }
                  }
                  if (!dispatchGesture(g, cb, Handler(Looper.getMainLooper()))) return false
                  latch.await(3, TimeUnit.SECONDS)
                  return ok
              }

              fun focusedInput(): AccessibilityNodeInfo? {
                  for (r in roots()) {
                      val f = r.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                      if (f != null && f.isEditable) return f
                  }
                  var found: AccessibilityNodeInfo? = null
                  for (r in roots()) walk(r, 0) { n, _ ->
                      if (found == null && n.isEditable && n.isVisibleToUser) found = n
                      true
                  }
                  return found
              }

              fun typeText(text: String, append: Boolean = false): Boolean {
                  val node = focusedInput() ?: return false
                  val cur = if (append) (node.text?.toString() ?: "") else ""
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, cur + text)
                  if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) return true
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("novax", text))
                  node.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  return node.performAction(AccessibilityNodeInfo.ACTION_PASTE)
              }

              fun pressEnter(): Boolean {
                  val node = focusedInput() ?: return false
                  if (Build.VERSION.SDK_INT >= 30) {
                      if (node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)) return true
                  }
                  return clickText("ara", true) || clickText("search", true) || clickText("git", true) || clickText("gonder", true)
              }

              fun global(name: String): Boolean {
                  val a = when (name.lowercase().trim()) {
                      "back", "geri" -> GLOBAL_ACTION_BACK
                      "home", "ana ekran" -> GLOBAL_ACTION_HOME
                      "recents", "son uygulamalar" -> GLOBAL_ACTION_RECENTS
                      "notifications", "bildirimler" -> GLOBAL_ACTION_NOTIFICATIONS
                      "quick_settings", "hizli ayarlar" -> GLOBAL_ACTION_QUICK_SETTINGS
                      "power", "guc" -> GLOBAL_ACTION_POWER_DIALOG
                      "lock", "kilit" -> if (Build.VERSION.SDK_INT >= 28) GLOBAL_ACTION_LOCK_SCREEN else return false
                      "screenshot" -> if (Build.VERSION.SDK_INT >= 28) GLOBAL_ACTION_TAKE_SCREENSHOT else return false
                      else -> return false
                  }
                  return performGlobalAction(a)
              }

              fun scrollContainer(forward: Boolean): Boolean {
                  var target: AccessibilityNodeInfo? = null
                  for (r in roots()) walk(r, 0) { n, _ ->
                      if (target == null && n.isScrollable && n.isVisibleToUser) target = n
                      true
                  }
                  val t = target ?: return false
                  return t.performAction(if (forward) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD)
              }

              fun waitForText(q: String, timeoutMs: Long): Boolean {
                  val end = SystemClock.uptimeMillis() + timeoutMs
                  while (SystemClock.uptimeMillis() < end) {
                      if (findAll(q).isNotEmpty()) return true
                      Thread.sleep(300)
                  }
                  return false
              }

              fun waitForPackage(pkg: String, timeoutMs: Long): Boolean {
                  val end = SystemClock.uptimeMillis() + timeoutMs
                  while (SystemClock.uptimeMillis() < end) {
                      if (rootInActiveWindow?.packageName?.toString() == pkg || lastPackage == pkg) return true
                      Thread.sleep(250)
                  }
                  return false
              }

              // ------------------------------------------------------------------ ekranı metne dök
              fun dump(max: Int = 4500): String {
                  val sb = StringBuilder()
                  val pkg = rootInActiveWindow?.packageName ?: "?"
                  sb.append("Uygulama: ").append(pkg).append('\n')
                  for (r in roots()) walk(r, 0) { n, d ->
                      val t = n.text?.toString()?.replace("\n", " ") ?: ""
                      val c = n.contentDescription?.toString()?.replace("\n", " ") ?: ""
                      val interesting = t.isNotBlank() || c.isNotBlank() || n.isClickable || n.isEditable
                      if (interesting && n.isVisibleToUser && sb.length < max) {
                          val r2 = Rect()
                          n.getBoundsInScreen(r2)
                          sb.append(" ".repeat(minOf(d, 5)))
                          sb.append(n.className?.toString()?.substringAfterLast('.') ?: "View")
                          if (t.isNotBlank()) sb.append(" \"").append(Text.clip(t, 90)).append('"')
                          if (c.isNotBlank() && c != t) sb.append(" desc=\"").append(Text.clip(c, 60)).append('"')
                          if (n.isEditable) sb.append(" [yazılabilir]")
                          if (n.isClickable) sb.append(" [tıklanır]")
                          if (n.isScrollable) sb.append(" [kaydırılır]")
                          if (n.isChecked) sb.append(" [seçili]")
                          sb.append(" @(").append(r2.centerX()).append(',').append(r2.centerY()).append(")\n")
                      }
                      sb.length < max
                  }
                  return sb.toString()
              }

              // ------------------------------------------------------------------ ekran görüntüsü
              fun screenshot(): Bitmap? {
                  if (Build.VERSION.SDK_INT < 30) return null
                  val latch = CountDownLatch(1)
                  var bmp: Bitmap? = null
                  takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                      override fun onSuccess(result: ScreenshotResult) {
                          val hb = result.hardwareBuffer
                          val b = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                          bmp = b?.copy(Bitmap.Config.ARGB_8888, false)
                          hb.close()
                          latch.countDown()
                      }
                      override fun onFailure(errorCode: Int) { latch.countDown() }
                  })
                  latch.await(5, TimeUnit.SECONDS)
                  return bmp
              }

              fun screenshotFile(): File? {
                  val b = screenshot() ?: return null
                  val dir = getExternalFilesDir("screenshots") ?: filesDir
                  dir.mkdirs()
                  val f = File(dir, "novax_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".png")
                  f.outputStream().use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  return f
              }

              fun screenshotJpegBase64(maxSide: Int = 1280): String? {
                  val b = screenshot() ?: return null
                  val scale = maxSide.toFloat() / maxOf(b.width, b.height)
                  val s = if (scale < 1f) Bitmap.createScaledBitmap(b, (b.width * scale).toInt(), (b.height * scale).toInt(), true) else b
                  val bos = ByteArrayOutputStream()
                  s.compress(Bitmap.CompressFormat.JPEG, 72, bos)
                  return android.util.Base64.encodeToString(bos.toByteArray(), android.util.Base64.NO_WRAP)
              }
          }
          NOVAX_EOF

