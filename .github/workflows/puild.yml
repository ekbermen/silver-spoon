          package com.novax.assistant

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.PowerManager
          import android.provider.Settings

          /** Kurulum ekranındaki izin satırları: durum kontrolü + istek. */
          object Perms {
              class Item(val title: String, val why: String, val critical: Boolean, val ok: (Context) -> Boolean, val ask: (Activity) -> Unit)

              const val REQ = 4411

              private fun rt(ctx: Context, p: String) = ctx.checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED
              private fun ask(a: Activity, vararg p: String) = a.requestPermissions(arrayOf(*p), REQ)

              fun accessibilityOn(ctx: Context): Boolean {
                  if (NovaxAccessibilityService.connected) return true
                  val s = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return s.contains(ctx.packageName + "/", true)
              }

              fun items(): List<Item> = listOf(
                  Item("Mikrofon", "Sesli komut ve uyandırma kelimesi", true, { rt(it, Manifest.permission.RECORD_AUDIO) }, { ask(it, Manifest.permission.RECORD_AUDIO) }),
                  Item("Bildirimler", "Servis bildirimi ve görev sonuçları", false,
                      { Build.VERSION.SDK_INT < 33 || rt(it, Manifest.permission.POST_NOTIFICATIONS) },
                      { if (Build.VERSION.SDK_INT >= 33) ask(it, Manifest.permission.POST_NOTIFICATIONS) }),
                  Item("Rehber", "\"Anneme yaz\" gibi isimle komutlar", false, { rt(it, Manifest.permission.READ_CONTACTS) }, { ask(it, Manifest.permission.READ_CONTACTS) }),
                  Item("Telefon araması", "Kişiyi doğrudan arama", false, { rt(it, Manifest.permission.CALL_PHONE) }, { ask(it, Manifest.permission.CALL_PHONE) }),
                  Item("SMS", "SMS gönderme", false, { rt(it, Manifest.permission.SEND_SMS) }, { ask(it, Manifest.permission.SEND_SMS) }),
                  Item("Erişilebilirlik", "Ekranı okuma, dokunma, yazma, WhatsApp gönder tuşu. Android 13+ ta: Uygulama bilgisi > ⋮ > Kısıtlanmış ayarlara izin ver", true,
                      { accessibilityOn(it) }, { it.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }),
                  Item("Üstte göster", "Arka plandan uygulama açma ve yüzen orb", false,
                      { Settings.canDrawOverlays(it) },
                      { it.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + it.packageName))) }),
                  Item("Sistem ayarları", "Parlaklık değiştirme", false,
                      { Settings.System.canWrite(it) },
                      { it.startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + it.packageName))) }),
                  Item("Pil kısıtı yok", "Arka planda öldürülmemek için", false,
                      { (it.getSystemService(Context.POWER_SERVICE) as PowerManager).isIgnoringBatteryOptimizations(it.packageName) },
                      { it.startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + it.packageName))) })
              )

              fun micGranted(ctx: Context) = rt(ctx, Manifest.permission.RECORD_AUDIO)

              fun missingCritical(ctx: Context): List<Item> = items().filter { it.critical && !it.ok(ctx) }
          }
          NOVAX_EOF

