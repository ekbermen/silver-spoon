        run: |
          cat > app/src/main/java/com/novax/assistant/HudBackgroundView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.view.View
          import java.util.Random
          import kotlin.math.sin

          /** Koyu mavi HUD zemin: ızgara, tarama çizgisi, köşe parantezleri ve süzülen parçacıklar. */
          class HudBackgroundView(ctx: Context) : View(ctx) {
              private val d = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rnd = Random(7)
              private val n = 42
              private val px = FloatArray(n) { rnd.nextFloat() }
              private val py = FloatArray(n) { rnd.nextFloat() }
              private val ps = FloatArray(n) { 0.01f + rnd.nextFloat() * 0.04f }
              private val pr = FloatArray(n) { 0.8f + rnd.nextFloat() * 1.8f }
              private var t = 0f
              private var last = 0L
              private var bg: LinearGradient? = null

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  bg = LinearGradient(0f, 0f, 0f, h.toFloat(), intArrayOf(0xFF010409.toInt(), 0xFF03111E.toInt(), 0xFF020A12.toInt()), null, Shader.TileMode.CLAMP)
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  val now = System.nanoTime()
                  val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.05f)
                  last = now; t += dt

                  p.reset(); p.isAntiAlias = true
                  p.shader = bg
                  c.drawRect(0f, 0f, w, h, p)
                  p.shader = null

                  // ızgara
                  p.style = Paint.Style.STROKE; p.strokeWidth = 1f
                  p.color = 0x1200E5FF
                  val step = 38f * d
                  var x = 0f
                  while (x < w) { c.drawLine(x, 0f, x, h, p); x += step }
                  var y = (t * 6f * d) % step
                  while (y < h) { c.drawLine(0f, y, w, y, p); y += step }

                  // tarama çizgisi
                  val sy = ((t * 0.12f) % 1f) * h
                  p.shader = LinearGradient(0f, sy - 60f * d, 0f, sy, intArrayOf(0, 0x2800E5FF), null, Shader.TileMode.CLAMP)
                  p.style = Paint.Style.FILL
                  c.drawRect(0f, sy - 60f * d, w, sy, p)
                  p.shader = null

                  // parçacıklar
                  p.style = Paint.Style.FILL
                  for (i in 0 until n) {
                      py[i] -= ps[i] * dt
                      if (py[i] < 0f) { py[i] = 1f; px[i] = rnd.nextFloat() }
                      val a = (0.25f + 0.25f * sin(t * 2f + i)).coerceIn(0f, 1f)
                      p.color = ((a * 255).toInt() shl 24) or 0x0000E5FF
                      c.drawCircle(px[i] * w, py[i] * h, pr[i] * d, p)
                  }

                  // köşe parantezleri
                  p.style = Paint.Style.STROKE; p.strokeWidth = 2f * d; p.color = 0xAA00E5FF.toInt()
                  val m = 10f * d; val l = 26f * d
                  c.drawLine(m, m, m + l, m, p); c.drawLine(m, m, m, m + l, p)
                  c.drawLine(w - m, m, w - m - l, m, p); c.drawLine(w - m, m, w - m, m + l, p)
                  c.drawLine(m, h - m, m + l, h - m, p); c.drawLine(m, h - m, m, h - m - l, p)
                  c.drawLine(w - m, h - m, w - m - l, h - m, p); c.drawLine(w - m, h - m, w - m, h - m - l, p)

                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/JarvisReactorView.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/JarvisReactorView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.view.View
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin

          /** Arc-reaktör tarzı animasyonlu orb. Duruma göre renk, hız ve parlaklık değiştirir. */
          class JarvisReactorView(ctx: Context) : View(ctx) {
              var state: OrbState = OrbState.IDLE
                  set(v) { field = v; postInvalidateOnAnimation() }
              var level: Float = 0f

              private val dens = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val path = Path()
              private var cx = 0f
              private var cy = 0f
              private var radius = 0f
              private var t = 0f
              private var phase = 0f
              private var smooth = 0.25f
              private var lvl = 0f
              private var lastNs = 0L

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  cx = w / 2f; cy = h / 2f; radius = min(w, h) / 2f * 0.95f
              }

              private fun color(): Int = when (state) {
                  OrbState.IDLE -> 0xFF00B8D4.toInt()
                  OrbState.LISTENING -> 0xFF00F0FF.toInt()
                  OrbState.THINKING -> 0xFFFFB300.toInt()
                  OrbState.SPEAKING -> 0xFF69F0FF.toInt()
                  OrbState.ERROR -> 0xFFFF3D3D.toInt()
              }

              private fun alpha(c: Int, a: Float): Int = ((a.coerceIn(0f, 1f) * 255).toInt() shl 24) or (c and 0x00FFFFFF)

              override fun onDraw(c: Canvas) {
                  if (radius <= 0f) return
                  val now = System.nanoTime()
                  val dt = if (lastNs == 0L) 0.016f else ((now - lastNs) / 1e9f).coerceAtMost(0.05f)
                  lastNs = now
                  t += dt
                  val speed = when (state) {
                      OrbState.IDLE -> 0.5f; OrbState.LISTENING -> 1.3f; OrbState.THINKING -> 3.4f
                      OrbState.SPEAKING -> 1.9f; OrbState.ERROR -> 0.3f
                  }
                  phase += dt * speed
                  lvl += (level - lvl) * min(1f, dt * 10f)
                  val target = when (state) {
                      OrbState.IDLE -> 0.28f
                      OrbState.LISTENING -> 0.45f + lvl * 0.55f
                      OrbState.THINKING -> 0.65f + 0.2f * sin(t * 6f)
                      OrbState.SPEAKING -> 0.55f + 0.4f * abs(sin(t * 7.3f) * cos(t * 3.1f))
                      OrbState.ERROR -> 0.85f
                  }
                  smooth += (target - smooth) * min(1f, dt * 8f)
                  val col = color()
                  val r = radius

                  // dış parıltı
                  p.reset(); p.isAntiAlias = true
                  p.shader = RadialGradient(cx, cy, r, intArrayOf(alpha(col, 0.55f * smooth), alpha(col, 0.12f * smooth), 0), floatArrayOf(0.15f, 0.65f, 1f), Shader.TileMode.CLAMP)
                  c.drawCircle(cx, cy, r, p)
                  p.shader = null

                  // 1) dış ince halka
                  p.style = Paint.Style.STROKE; p.strokeWidth = 1.4f * dens
                  p.color = alpha(col, 0.55f)
                  c.drawCircle(cx, cy, r * 0.97f, p)

                  // 2) tik halkası (yavaş döner)
                  c.save(); c.rotate(phase * 9f, cx, cy)
                  p.strokeWidth = 1.2f * dens
                  for (i in 0 until 72) {
                      val a = i * (2 * PI / 72).toFloat()
                      val long = i % 6 == 0
                      val r1 = r * (if (long) 0.86f else 0.9f)
                      val r2 = r * 0.94f
                      p.color = alpha(col, if (long) 0.9f else 0.4f)
                      c.drawLine(cx + cos(a) * r1, cy + sin(a) * r1, cx + cos(a) * r2, cy + sin(a) * r2, p)
                  }
                  c.restore()

                  // 3) kalın yay parçaları (ters döner)
                  rect.set(cx - r * 0.78f, cy - r * 0.78f, cx + r * 0.78f, cy + r * 0.78f)
                  p.strokeWidth = 5.5f * dens; p.strokeCap = Paint.Cap.ROUND
                  for (i in 0 until 3) {
                      p.color = alpha(col, 0.35f + 0.5f * smooth)
                      c.drawArc(rect, -phase * 38f + i * 120f, 72f, false, p)
                  }
                  p.strokeCap = Paint.Cap.BUTT

                  // 4) kesikli halka
                  p.strokeWidth = 2f * dens
                  p.pathEffect = DashPathEffect(floatArrayOf(9f * dens, 13f * dens), phase * 40f * dens)
                  p.color = alpha(col, 0.6f)
                  c.drawCircle(cx, cy, r * 0.66f, p)
                  p.pathEffect = null

                  // 5) tarama yayı (düşünürken belirgin)
                  rect.set(cx - r * 0.7f, cy - r * 0.7f, cx + r * 0.7f, cy + r * 0.7f)
                  p.strokeWidth = 2.2f * dens
                  p.color = alpha(col, if (state == OrbState.THINKING) 0.95f else 0.3f)
                  c.drawArc(rect, phase * 110f, if (state == OrbState.THINKING) 110f else 30f, false, p)

                  // 6) altıgen çekirdek çerçevesi
                  c.save(); c.rotate(-phase * 22f, cx, cy)
                  path.reset()
                  val hr = r * (0.5f + 0.03f * smooth)
                  for (i in 0 until 6) {
                      val a = (i * PI / 3).toFloat()
                      val x = cx + cos(a) * hr; val y = cy + sin(a) * hr
                      if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                  }
                  path.close()
                  p.strokeWidth = 2.2f * dens; p.color = alpha(col, 0.85f)
                  c.drawPath(path, p)
                  p.strokeWidth = 1f * dens; p.color = alpha(col, 0.4f)
                  for (i in 0 until 6 step 2) {
                      val a = (i * PI / 3).toFloat()
                      c.drawLine(cx + cos(a) * hr, cy + sin(a) * hr, cx - cos(a) * hr, cy - sin(a) * hr, p)
                  }
                  c.restore()

                  // 7) ses seviyesi halkası
                  p.strokeWidth = 3f * dens; p.color = alpha(col, 0.35f + 0.5f * lvl)
                  c.drawCircle(cx, cy, r * (0.38f + 0.12f * (if (state == OrbState.LISTENING) lvl else smooth * 0.5f)), p)

                  // 8) yörünge noktaları
                  p.style = Paint.Style.FILL
                  for (i in 0 until 3) {
                      val a = phase * 1.6f + i * (2f * PI.toFloat() / 3f)
                      p.color = alpha(col, 0.95f)
                      c.drawCircle(cx + cos(a) * r * 0.58f, cy + sin(a) * r * 0.58f, 3f * dens, p)
                  }

                  // 9) çekirdek
                  val cr = r * (0.27f + 0.05f * smooth)
                  p.shader = RadialGradient(cx, cy, cr, intArrayOf(0xFFFFFFFF.toInt(), alpha(col, 0.95f), alpha(col, 0.15f)), floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                  c.drawCircle(cx, cy, cr, p)
                  p.shader = null

                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

