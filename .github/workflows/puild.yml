                  NovaxApp.createChannels(ctx)
                  val pi = PendingIntent.getActivity(ctx, 7, Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(ctx, NovaxApp.CH_ALERT)
