                  "minecraft" to listOf("com.mojang.minecraftpe"), "roblox" to listOf("com.roblox.client"), "pubg" to listOf("com.tencent.ig"),
                  "zoom" to listOf("us.zoom.videomeet"), "teams" to listOf("com.microsoft.teams"), "outlook" to listOf("com.microsoft.office.outlook"),
                  "linkedin" to listOf("com.linkedin.android"), "pinterest" to listOf("com.pinterest"), "reddit" to listOf("com.reddit.frontpage")
              )

              @Synchronized fun all(): List<App> {
                  val now = System.currentTimeMillis()
                  if (cache.isNotEmpty() && now - stamp < 120_000) return cache
                  val pm = NovaxApp.instance.packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = pm.queryIntentActivities(i, PackageManager.MATCH_ALL)
                      .map { App(it.loadLabel(pm).toString(), it.activityInfo.packageName, Text.norm(it.loadLabel(pm).toString())) }
                      .distinctBy { it.pkg }
                      .sortedBy { it.norm }
                  cache = list; stamp = now
                  return list
              }

              fun find(spoken: String): App? {
                  val apps = all()
                  val stems = Text.stems(spoken).map { it.removeSuffix(" uygulamasi").removeSuffix(" uygulamasini").trim() }.filter { it.isNotEmpty() }
                  for (cand in stems) {
                      val pk = alias[cand]
                      if (pk != null) for (p in pk) apps.firstOrNull { it.pkg == p || it.pkg.startsWith("$p.") }?.let { return it }
                  }
                  var best: App? = null
                  var bestScore = 0
                  for (cand in stems) for (a in apps) {
                      var s = 0
                      if (a.norm == cand) s = 100
                      else if (a.norm.startsWith(cand) && cand.length >= 3) s = 80 - minOf(15, a.norm.length - cand.length)
                      else if (cand.length >= 4 && a.norm.contains(cand)) s = 60
                      else if (a.norm.length >= 4 && cand.contains(a.norm)) s = 50
                      else if (cand.length >= 5 && Text.lev(a.norm, cand) <= maxOf(1, cand.length / 5)) s = 40
                      if (s > bestScore) { bestScore = s; best = a }
                  }
                  return best
              }

              fun listText(filter: String): String {
                  val n = Text.norm(filter)
                  val l = all().filter { n.isEmpty() || it.norm.contains(n) }
                  return if (l.isEmpty()) "Eşleşen uygulama yok." else l.take(60).joinToString(", ") { it.label }
              }
          }
